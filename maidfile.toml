[tasks.build]
path = "build"
script = "meson compile"

[tasks.reconfigure]
path = "build"
script = "meson setup --reconfigure"

[tasks.strip]
path = "build"
script = "strip ant"

[tasks.download]
script = ['.github/download.sh "%{arg.1}"', "open .github/artifacts"]

[tasks.run]
script = ["maid build -q", "./build/ant %{arg.1}"]

[tasks.preflight]
script = "ant .github/agents/check_all.js"

[tasks.knowledge]
script = "ant .github/agents/check_repo_knowledge.js"

[tasks.structure]
script = "ant .github/agents/check_repo_structure.js"

[tasks.validate_changes]
script = "ant .github/agents/route_validation.js"

[tasks.setup]
script = ['meson subprojects download', 'meson setup build --wipe']

[tasks.asan]
script = ['meson subprojects download', 'meson setup build --wipe -Db_sanitize=address -Doptimization=0 -Db_lto=false -Dstrip=false -Db_lundef=false']

[tasks.fuzz_setup]
script = ['meson subprojects download', 'CC=clang CXX=clang++ meson setup build-fuzz --wipe -Dfuzz=enabled -Db_sanitize=address,undefined -Db_lundef=false -Db_lto=false -Doptimization=1 -Ddebug=true -Dstrip=false -Dpgo=disabled']

[tasks.fuzz]
script = ['''
#!/usr/bin/env bash
set -euo pipefail
target="%{arg.1}"
seconds="%{arg.2}"
[[ "$seconds" =~ ^[0-9]+$ ]] || seconds=60
# the GC heap is invisible to LeakSanitizer, and its stack scan needs real
# frames (see tests/fuzz/fuzz_js.c)
asan="detect_leaks=1"
[ "$target" = js ] && asan="detect_leaks=0:detect_stack_use_after_return=0"
meson compile -C build-fuzz "fuzz-$target"
mkdir -p "build-fuzz/corpus/$target"
UBSAN_OPTIONS="suppressions=tests/fuzz/ubsan.supp:print_stacktrace=1" \
ASAN_OPTIONS="$asan" \
  ./build-fuzz/meson/tests/fuzz/fuzz-$target -max_total_time="$seconds" "build-fuzz/corpus/$target" "tests/fuzz/corpus/$target"
''']

[tasks.debug]
script = [
  'meson subprojects download',
  'meson setup build --wipe --buildtype=debug -Doptimization=0 -Db_lto=false -Dstrip=false -Db_lundef=false -Dunity=off'
]

[tasks.install]
script = ['''
#!/usr/bin/env bash
set -euo pipefail

meson compile -C build
if [ "%{arg.1}" != "exclude-runtime" ]; then
  meson compile -C build ant-runtime

  revision=$(./build/ant -e 'console.log(Ant.revision)')
  runtime_dir="$HOME/.ant/compile/$revision"

  mkdir -p "$runtime_dir"
  cp ./build/ant-runtime "$runtime_dir/ant-runtime"
fi

if which ant >/dev/null 2>&1; then
  dir=$(dirname "$(which ant)")
  cp ./build/ant "$dir/ant"
  ln -sf "$dir/ant" "$dir/antx"
else
  mkdir -p ~/.ant/bin
  cp ./build/ant ~/.ant/bin/
  ln -sf ~/.ant/bin/ant ~/.ant/bin/antx
fi
''']
