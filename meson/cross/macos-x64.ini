[binaries]
c = ['clang', '--target=x86_64-apple-macos15.0']
cpp = ['clang++', '--target=x86_64-apple-macos15.0']
ar = 'llvm-ar'
strip = '/usr/bin/strip'
pkg-config = 'pkg-config'
cmake = 'cmake'

[host_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true
pkg_config_libdir = []

[cmake]
CMAKE_OSX_ARCHITECTURES = 'x86_64'
CMAKE_OSX_DEPLOYMENT_TARGET = '15.0'

[project options]
native_tuning = 'disabled'
