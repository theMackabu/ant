name: Repo Knowledge

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - name: Validate repo knowledge docs
        run: node .github/agents/check_repo_knowledge.js
      - name: Collect changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            git diff --name-only "origin/$BASE_REF...HEAD" > .changed-files
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$GITHUB_SHA" > .changed-files
          elif base=$(git merge-base "origin/$DEFAULT_BRANCH" "$GITHUB_SHA" 2>/dev/null); then
            # a force-push leaves the old head unreachable; compare with the default branch
            git diff --name-only "$base" "$GITHUB_SHA" > .changed-files
          else
            git ls-files > .changed-files
          fi
      - name: Validate changed-file structure
        run: node .github/agents/check_repo_structure.js --files-from .changed-files
      - name: Suggest validation commands
        run: node .github/agents/route_validation.js --files-from .changed-files
