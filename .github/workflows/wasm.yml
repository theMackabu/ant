name: WebAssembly Package

on:
  push:
    paths:
      - '.github/workflows/wasm.yml'
      - 'include/**'
      - 'packages/wasm/**'
      - 'src/**'
      - 'vendor/**'
  pull_request:
    paths:
      - '.github/workflows/wasm.yml'
      - 'include/**'
      - 'packages/wasm/**'
      - 'src/**'
      - 'vendor/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Install Meson and Ninja
        run: python -m pip install meson==1.10.1 ninja==1.13.0

      - name: Cache wasi-sdk
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: packages/wasm/.cache
          key: wasm-sdk-34-${{ runner.os }}-${{ runner.arch }}

      - name: Build package
        working-directory: packages/wasm
        run: npm run build

      - name: Verify package contents
        working-directory: packages/wasm
        run: npm pack --dry-run --ignore-scripts

      - name: Upload package build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wasm-dist-${{ matrix.os }}
          path: packages/wasm/dist
          if-no-files-found: error

  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 18
            artifact: wasm-dist-ubuntu-24.04
          - os: ubuntu-24.04
            node: 22
            artifact: wasm-dist-ubuntu-24.04
          - os: windows-latest
            node: 22
            artifact: wasm-dist-windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}

      - name: Download package build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ matrix.artifact }}
          path: packages/wasm/dist

      - name: Test package
        working-directory: packages/wasm
        run: node --test test/*.test.js
