name: Build Musl Sandboxes

on:
  workflow_call:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.timestamp.outputs.value }}
    steps:
      - id: timestamp
        run: echo "value=$(date +%s)" >> "$GITHUB_OUTPUT"

  build-musl:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-musl-x64
          - linux-musl-aarch64
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ${{ matrix.platform }}
      build_timestamp: ${{ needs.prepare.outputs.timestamp }}

  sandbox-x64:
    needs: build-musl
    if: ${{ !cancelled() && needs.build-musl.result == 'success' }}
    uses: ./.github/workflows/build-nanos.yml
    with:
      arch: x64
      artifact: ant-linux-x64-musl
      runner: ubuntu-latest
      image: ant-sandbox-x64
      source_run_id: ${{ github.run_id }}
      source_revision: ${{ github.sha }}

  sandbox-aarch64:
    needs: build-musl
    if: ${{ !cancelled() && needs.build-musl.result == 'success' }}
    uses: ./.github/workflows/build-nanos.yml
    with:
      arch: aarch64
      artifact: ant-linux-aarch64-musl
      runner: ubuntu-24.04-arm
      image: ant-sandbox-aarch64
      source_run_id: ${{ github.run_id }}
      source_revision: ${{ github.sha }}

  summary:
    runs-on: ubuntu-latest
    needs: [build-musl, sandbox-x64, sandbox-aarch64]
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Download bench-v8 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: bench-v8-*
          path: bench-v8-results

      - name: Summarize sandbox artifacts
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Musl sandbox artifacts

          This workflow uploads:

          - `ant-linux-x64-musl`
          - `ant-linux-aarch64-musl`
          - `ant-sandbox-x64`
          - `ant-sandbox-aarch64`

          Each sandbox artifact contains the paired `ant-sandbox-<arch>.img`
          and `ant-kernel-<arch>.img` files.
          SUMMARY

      - name: Generate bench-v8 summary
        id: bench_v8_summary
        run: |
          PLATFORMS=(linux-musl-x64 linux-musl-aarch64)
          LABELS=(Overall Richards DeltaBlue Crypto RayTrace EarleyBoyer RegExp Splay NavierStokes)
          FILTERS=(
            .score
            .results.Richards
            .results.DeltaBlue
            .results.Crypto
            .results.RayTrace
            .results.EarleyBoyer
            .results.RegExp
            .results.Splay
            .results.NavierStokes
          )
          found=false

          {
            echo "## bench-v8"
            echo
            printf '| Platform'
            for label in "${LABELS[@]}"; do
              printf ' | %s' "$label"
            done
            echo ' |'

            printf '|---'
            for _ in "${LABELS[@]}"; do
              printf '|---:'
            done
            echo '|'

            for platform in "${PLATFORMS[@]}"; do
              result="bench-v8-results/bench-v8-$platform/$platform.json"
              printf '| `%s`' "$platform"
              if [[ -f "$result" ]]; then
                found=true
                for filter in "${FILTERS[@]}"; do
                  value=$(jq -r "$filter | if type == \"number\" then . else \"N/A\" end" "$result")
                  printf ' | %s' "$value"
                done
              else
                for _ in "${LABELS[@]}"; do
                  printf ' | N/A'
                done
              fi
              echo ' |'
            done
          } >> "$GITHUB_STEP_SUMMARY"

          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Consolidate bench-v8 artifacts
        if: ${{ steps.bench_v8_summary.outputs.found == 'true' }}
        uses: actions/upload-artifact/merge@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bench-v8-results
          pattern: bench-v8-*
          delete-merged: true
