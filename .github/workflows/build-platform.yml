name: Build Platform

on:
  workflow_call:
    inputs:
      platform:
        description: 'Platform key from versions.json targets'
        required: true
        type: string
      build_timestamp:
        required: true
        type: string
    outputs:
      version:
        description: Build version
        value: ${{ inputs.platform == 'macos-x64' && jobs.validate_macos_x64.outputs.version || jobs.build.outputs.version }}
      bench_v8_score:
        description: bench-v8 geometric-mean score
        value: ${{ inputs.platform == 'macos-x64' && jobs.validate_macos_x64.outputs.bench_v8_score || jobs.build.outputs.bench_v8_score }}

jobs:
  build:
    uses: ./.github/workflows/build-binary.yml
    with:
      platform: ${{ inputs.platform }}
      build_timestamp: ${{ inputs.build_timestamp }}

  validate_macos_x64:
    name: Validate macOS x64 on Intel
    needs: build
    if: inputs.platform == 'macos-x64'
    runs-on: macos-15-intel
    outputs:
      version: ${{ steps.version.outputs.version }}
      bench_v8_score: ${{ steps.bench_v8.outputs.score }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Download x64 binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ant*-darwin-x64
          merge-multiple: true
          path: build

      - name: Verify x64 binaries
        id: version
        shell: bash
        run: |
          [[ "$(uname -m)" == "x86_64" ]]
          for bin in build/ant build/ant-runtime; do
            [[ "$(lipo -archs "$bin")" == "x86_64" ]]
            chmod +x "$bin"
            codesign --verify --verbose "$bin"
          done
          VERSION=$(./build/ant --version-raw)
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION" > version.txt
          echo "${{ inputs.build_timestamp }}" > build-timestamp.txt

      - name: Test x64 runtime
        shell: bash
        run: |
          ./build/ant tests/test_ant_cron.cjs
          ./build/ant tests/test_ant_cron_os.cjs
          ./build/ant tests/test_compile_basic.cjs
          ./build/ant tests/test_temporal.js

      - name: Run bench-v8
        id: bench_v8
        uses: ./.github/actions/bench-v8
        with:
          platform: ${{ inputs.platform }}

      - name: Upload version info
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: version-ant-darwin-x64
          path: |
            version.txt
            build-timestamp.txt
          retention-days: 1
