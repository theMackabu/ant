name: Publish Docker Image (musl)

on:
  workflow_call:
    inputs:
      tag:
        description: Docker Hub tag to publish
        required: true
        type: string
      build_timestamp:
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: themackabu/ant

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.musl
          target: runtime
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILD_GIT_HASH=${{ github.sha }}
            BUILD_TIMESTAMP=${{ inputs.build_timestamp }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=9,force-compression=true,oci-mediatypes=true
          sbom: true
          cache-from: type=gha,scope=docker-musl-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-musl-${{ matrix.arch }},mode=max

      - name: Smoke test native image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --platform "linux/$ARCH" "$IMAGE@$DIGEST" --version
          docker run --rm --platform "linux/$ARCH" "$IMAGE@$DIGEST" -e 'if (1 + 1 !== 2) throw new Error("smoke test failed")'
          docker run --rm --platform "linux/$ARCH" "$IMAGE@$DIGEST" -e 'if (process.getuid() === 0) throw new Error("image runs as root")'

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$ARCH.digest"

      - name: Upload digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: docker-digest-musl-${{ matrix.arch }}
          path: digests/*.digest
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform tag
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: docker-digest-musl-*
          path: digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Combine and publish
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          tag="$IMAGE:$IMAGE_TAG"
          sources=()
          for arch in amd64 arm64; do
            digest=$(cat "digests/$arch.digest")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --tag "$tag" "${sources[@]}"
          docker buildx imagetools inspect "$tag"
          echo "Published \`$tag\` for linux/amd64 and linux/arm64." >> "$GITHUB_STEP_SUMMARY"
