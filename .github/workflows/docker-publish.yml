name: Publish Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker Hub tag to publish
        required: true
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      timestamp: ${{ steps.metadata.outputs.timestamp }}
    steps:
      - name: Validate tag and set build timestamp
        id: metadata
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,121}$ ]]; then
            echo 'Invalid Docker tag' >&2
            exit 1
          fi
          echo "timestamp=$(date +%s)" >> "$GITHUB_OUTPUT"

  musl:
    needs: prepare
    uses: ./.github/workflows/docker-publish-musl.yml
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      build_timestamp: ${{ needs.prepare.outputs.timestamp }}

  glibc:
    needs: prepare
    uses: ./.github/workflows/docker-publish-glibc.yml
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}-glibc
      build_timestamp: ${{ needs.prepare.outputs.timestamp }}
