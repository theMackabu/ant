name: Build CI Images

on:
  push:
    branches:
      - master
    paths:
      - '.github/docker/**'
      - '.github/versions.json'
      - '.github/workflows/ci-images.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      llvm: ${{ steps.meta.outputs.llvm }}
      node: ${{ steps.meta.outputs.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          sparse-checkout: .github/versions.json
          sparse-checkout-cone-mode: false

      - name: Load metadata
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "llvm=$(jq -r .tools.llvm .github/versions.json)" >> "$GITHUB_OUTPUT"
          echo "node=$(jq -r .tools.node .github/versions.json)" >> "$GITHUB_OUTPUT"

  glibc-build:
    name: Build glibc CI image (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/ant-ci-glibc
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          sparse-checkout: .github/docker
          sparse-checkout-cone-mode: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .github/docker
          file: .github/docker/ci-glibc.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            LLVM_VERSION=${{ needs.prepare.outputs.llvm }}
            NODE_VERSION=${{ needs.prepare.outputs.node }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=6,force-compression=true,oci-mediatypes=true
          cache-from: type=gha,scope=ci-glibc-${{ matrix.arch }}
          cache-to: type=gha,scope=ci-glibc-${{ matrix.arch }},mode=max

      - name: Smoke test native image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
          LLVM_VERSION: ${{ needs.prepare.outputs.llvm }}
        run: |
          docker run --rm --platform "linux/$ARCH" "$IMAGE@$DIGEST" bash -euo pipefail -c "
            clang-${LLVM_VERSION} --version
            ld.lld-${LLVM_VERSION} --version
            llvm-ar-${LLVM_VERSION} --version
            cc --version
            meson --version
            ninja --version
            cmake --version
            node --version
            python3 -c 'import tomli'
            jq --version
          "

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$ARCH.digest"

      - name: Upload digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ci-digest-glibc-${{ matrix.arch }}
          path: digests/*.digest
          if-no-files-found: error
          retention-days: 1

  glibc-publish:
    name: Publish glibc CI manifest
    needs: [prepare, glibc-build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/ant-ci-glibc
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ci-digest-glibc-*
          path: digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine and publish
        env:
          VERSION_TAG: ubuntu22.04-llvm${{ needs.prepare.outputs.llvm }}-node${{ needs.prepare.outputs.node }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest=$(cat "digests/$arch.digest")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION_TAG" \
            --tag "$IMAGE:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION_TAG"
          echo "Published \`$IMAGE:$VERSION_TAG\` and \`$IMAGE:latest\` for linux/amd64 and linux/arm64." >> "$GITHUB_STEP_SUMMARY"

  musl-build:
    name: Build musl CI image (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/ant-ci-musl
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          sparse-checkout: .github/docker
          sparse-checkout-cone-mode: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .github/docker
          file: .github/docker/ci-musl.Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=6,force-compression=true,oci-mediatypes=true
          cache-from: type=gha,scope=ci-musl-${{ matrix.arch }}
          cache-to: type=gha,scope=ci-musl-${{ matrix.arch }},mode=max

      - name: Smoke test native image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --platform "linux/$ARCH" "$IMAGE@$DIGEST" sh -eu -c "
            clang --version
            ld.lld --version
            llvm-ar --version
            meson --version
            ninja --version
            cmake --version
            node --version
            python3 -c 'import tomli'
            jq --version
            bash --version
          "

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$ARCH.digest"

      - name: Upload digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ci-digest-musl-${{ matrix.arch }}
          path: digests/*.digest
          if-no-files-found: error
          retention-days: 1

  musl-publish:
    name: Publish musl CI manifest
    needs: [prepare, musl-build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/ant-ci-musl
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ci-digest-musl-*
          path: digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine and publish
        env:
          VERSION_TAG: alpine3.23
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest=$(cat "digests/$arch.digest")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION_TAG" \
            --tag "$IMAGE:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION_TAG"
          echo "Published \`$IMAGE:$VERSION_TAG\` and \`$IMAGE:latest\` for linux/amd64 and linux/arm64." >> "$GITHUB_STEP_SUMMARY"
